<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#05060a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>00:11</title>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
    <div id="dot"></div>
    <div id="prompt"><span class="key">E</span><span id="prompt-t"></span></div>
    <div id="title"></div>
    <div id="sub"></div>
    <div id="toast"></div>
    <div id="hint"></div>
  </div>

  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <button class="btn" id="btn-act" type="button" aria-label="Agir">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="13" cy="13" r="9"/><circle cx="13" cy="13" r="2.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="btn-bag" type="button" aria-label="Inventaire">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    </button>
    <button class="btn" id="btn-pause" type="button" aria-label="Pause">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><rect x="4" y="3" width="3" height="12" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg>
    </button>
  </div>

  <div id="phone" class="panel">
    <button class="x" id="phone-x" type="button" aria-label="Fermer">
      <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <div class="device">
      <div class="bar"><span id="phone-stamp"></span><span>facebook</span></div>
      <div class="thread" id="phone-body"></div>
      <button class="home" id="phone-close" type="button" aria-label="Fermer"><span></span></button>
    </div>
  </div>

  <div id="bag" class="panel">
    <button class="x" id="bag-x" type="button" aria-label="Fermer">
      <svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4"><path d="M3 3l10 10M13 3L3 13"/></svg>
    </button>
    <div class="sheet">
      <h2>Ce que tu as trouvé</h2>
      <div id="bag-list"></div>
    </div>
  </div>

  <div id="pause" class="panel">
    <div class="sheet">
      <h2>Pause</h2>
      <button class="opt" id="m-resume" type="button">Reprendre</button>
      <button class="opt" id="m-sound" type="button">Son : actif</button>
      <button class="opt" id="m-music" type="button" hidden>Musique : non</button>
      <button class="opt" id="m-quality" type="button">Qualité : auto</button>
      <button class="opt" id="m-full" type="button" hidden>Plein écran</button>
      <button class="opt dim" id="m-restart" type="button">Recommencer</button>
    </div>
  </div>

  <div id="veil"></div>

  <div id="card">
    <div id="card-k"></div>
    <div id="card-t"></div>
    <div id="card-l"></div>
    <button id="card-b" type="button"></button>
  </div>

  <div id="intro">
    <button id="start" type="button"><span class="dot"></span><span class="hint">toucher pour commencer</span></button>
    <div id="clock"><span id="clock-hm">00:10</span><span id="clock-s">:57</span></div>
  </div>

  <div id="fallback">
    <div class="fb-clock">00:11</div>
    <p>Ce navigateur ne peut pas afficher le monde en 3D.<br>Ouvre le lien avec Chrome ou Safari à jour.</p>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
